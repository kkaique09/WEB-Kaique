<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adoção de Gatos</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        header {
            background: #b52c07;
            color: #fff;
            padding: 20px;
            text-align: center;
        }
        .container {
            display: flex;
            min-height: 90vh;
        }
        nav {
            width: 180px;
            background: #9fa41d;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        nav a {
            color: #272900;
            text-decoration: none;
            padding: 10px 20px;
            display: block;
            width: 100%;
            border-radius: 4px;
            margin-bottom: 8px;
            transition: background 0.2s, color 0.2s;
        }
        nav a:hover {
            background: #272900;
            color: #fff;
        }
        main {
            flex: 1;
            padding: 30px;
            background: #fff;
        }
        aside {
            width: 180px;
            background: #b52c07;
            color: #fff;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }
        aside h3 {
            margin-top: 0;
        }
        aside ul {
            list-style: none;
            padding: 0;
        }
        aside ul li {
            margin-bottom: 10px;
        }
        aside ul li a {
            color: #fff;
            text-decoration: none;
        }
        aside ul li a:hover {
            text-decoration: underline;
        }
        footer {
            background: #9fa41d;
            color: #fff;
            text-align: right;
            padding: 15px;
            font-size: 90%;
        }
    </style>
</head>
<body>
    <header>
        <h1>Adoção de Gatos</h1>
    </header>
    <div class="container">
        <nav>
            <a href="#">Principal</a>
            <a href="#">Adoção</a>
            <a href="#">Doação</a>
            <a href="#">Contatos</a>
        </nav>
        <main>
            <h2>Bem-vindo!</h2>
            <p>Adote um gatinho e ganhe um amigo para a vida toda.</p>
            <p>Veja nossos gatinhos disponíveis para adoção e dicas de cuidados.</p>
        </main>
        <aside>
            <h3>Links úteis</h3>
            <ul>
                <li><a href="#">Dicas de cuidados</a></li>
                <li><a href="#">Veterinários</a></li>
                <li><a href="#">Contato</a></li>
            </ul>
        </aside>
    </div>
    <footer>
        Copyright © AdoçãoGatos2025
    </footer>
</body>
</html>
